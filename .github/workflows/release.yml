# どのブランチへのプッシュでもテストを動かす。main のときだけ、$Version が未リリースなら vX.Y.Z をリリースする。
# run は BOM なしで実行され日本語が文字化けするので、英数字だけにして処理は .github/scripts に置く
name: リリース

on:
  push:
    paths:
      - copathy.ps1
      - install.ps1
      - '*.lnk'
      - .github/workflows/release.yml
      - .github/scripts/**
      - tests/**
  workflow_dispatch:

permissions:
  contents: write

# 続けてプッシュしたとき、古い版のリリースがあとから「最新」になって配られないよう、1 つずつ順に動かす
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # リリースノート用に履歴とタグをすべて取得する

      - name: copathy.ps1 を検証してバージョンを読み取る
        id: check
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .github/scripts/check-version.ps1

      - name: テストを動かす
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/run.ps1

      - name: 版の上げ忘れを確かめる
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .github/scripts/check-bumped.ps1

      - name: まだリリースされていなければリリースを作る（main のときだけ）
        if: github.ref == 'refs/heads/main'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .github/scripts/create-release.ps1
